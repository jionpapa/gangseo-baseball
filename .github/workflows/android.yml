name: 안드로이드 앱(APK) 만들기

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 서명 키: 저장소 Secrets에 GSB_KEYSTORE_B64 가 있으면 그 키를 쓰고,
      # 없으면 이번 빌드용 임시 키를 만듭니다(임시 키 APK는 업데이트 때 지우고 다시 깔아야 함).
      - name: 서명 키 준비
        env:
          KS_B64: ${{ secrets.GSB_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.GSB_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            echo "GSB_KEYSTORE_PASSWORD=${KS_PASS:-gangseo-key}" >> "$GITHUB_ENV"
            echo "SIGN_KIND=고정 키" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore android/app/release.jks -alias gangseo -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass gangseo-temp -keypass gangseo-temp -dname "CN=Gangseo"
            echo "GSB_KEYSTORE_PASSWORD=gangseo-temp" >> "$GITHUB_ENV"
            echo "SIGN_KIND=임시 키" >> "$GITHUB_ENV"
          fi

      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: 결과 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk gangseo-baseball.apk

      - name: 다운로드 페이지(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 강서리그 APK ${{ github.run_number }}
          make_latest: "true"
          body: |
            휴대폰에서 아래 gangseo-baseball.apk 를 눌러 받아 설치하세요.
            서명: ${{ env.SIGN_KIND }}
          files: gangseo-baseball.apk
